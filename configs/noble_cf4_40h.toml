[scan]
name = "noble_cf4_40h"
families = ["Xe", "Kr", "Ar"]
noble_percent = [60, 65, 70, 75, 80, 85, 90, 95]
pressures_atm = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
temperature_k = 293.15
energy_min_kev = 0.1
energy_max_kev = 500.0
energy_points = 100
ions = "constituents"

[physics]
density_model = "ideal-gas"
gas_constant_l_atm_mol_k = 0.082057366080960
avogadro_mol = 6.02214076e23
compound_correction = 1.0
incidence_angle_deg = 0.0
displacement_energy_ev = 21.0
lattice_binding_energy_ev = 0.0
surface_binding_energy_ev = 0.0

[srmodule]
timeout_s = 120

[trim]
# Direct full-cascade anchors. All six pressure rows are reconstructed from the
# 1-atm anchors because SRIM itself assumes STP gas stopping physics.
ions_per_job = 50
energy_points = 8
pressures_atm = [1.0]
derive_full_grid = true
cascade_type = 2
timeout_s = 3600
workers_default = 4
max_attempts = 3
target_sigma_margin = 6.0
target_width_factor = 2.0
minimum_monolayers = 120.0
edge_fraction = 0.98

[convergence]
enabled = true
noble_percent = [60, 95]
pressures_atm = [0.5, 3.0]
energies_kev = [0.1, 10.0, 500.0]
ions_per_job = 25
repeats = 3
# Keep the original quality gate: time-boxed points that do not reach it are
# flagged rather than silently represented as precise measurements.
maximum_relative_standard_error = 0.02

[validation]
qf_absolute_pressure_warning = 0.02
qf_absolute_pressure_failure = 0.05
srmodule_relative_tolerance = 1.0e-6
trim_srmodule_range_warning = 0.20
convergence_rse_severity = "warning"

[campaign]
sessions = 5
session_hours = 8.0
# TRIM jobs already in flight may drain during the final 75 minutes. The
# one-hour per-job timeout leaves shutdown/archiving margin inside eight hours.
stop_margin_minutes = 75.0
