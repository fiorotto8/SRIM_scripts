[study]
name = "cygno_hecf4_900mbar"
pressure_mbar = 900.0
temperature_k = 293.0
temperature_source = "Active Windows GasDensities.csv header specifies 293 K"
he_mole_fraction_dry = 0.60
cf4_mole_fraction_dry = 0.40
h2o_ppm_molar = 1000.0
o2_ppm_molar = 1000.0
impurity_convention = "Final wet-mixture mole fractions; dry He/CF4 ratio preserved in remaining 0.998"
species = ["H", "He", "C", "F", "O"]

[grid]
energy_min_kevnr = 0.1
energy_max_kevnr = 3000.0
energy_points = 28
pilot_energies_kevnr = [0.1, 1.0, 10.0, 100.0, 1000.0, 3000.0]
pilot_ions = 5
requested_eee_min_kev = 0.25
requested_eee_max_kev = 1000.0

[simulation]
backend = "native-windows"
workers = 4
cascade_type = 5
geometry = "Bulk source at midpoint of thick homogeneous gas; full cascades from TRIM.DAT"
ions_per_batch = 100
independent_batches = 3
maximum_batches = 9
random_seed_base = 20261015
compound_correction = 1.0
displacement_energy_ev = 21.0
lattice_binding_energy_ev = 0.000001
surface_binding_energy_ev = 0.000001
srmodule_timeout_s = 90
trim_timeout_s = 7200
target_width_factor = 8.0
target_sigma_margin = 6.0
exyz_energy_samples = 1000
maximum_secondary_recoils = 2000000

[validation]
maximum_qf_relative_sem = 0.02
maximum_range_relative_sem = 0.03
maximum_energy_budget_relative_residual = 0.01
impurity_material_relative_change = 0.02
confidence_level = 0.95

[systematics]
energies_kevnr = [1.0, 100.0, 1000.0]
displacement_energies_ev = [10.0, 30.0]
exyz_refinement_factors = [1, 4]
ions_per_batch = 100
independent_batches = 3
