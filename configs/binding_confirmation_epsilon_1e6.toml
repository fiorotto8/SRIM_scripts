[scan]
name = "binding_confirmation_epsilon_1e6"
profile = "preliminary"
families = ["Ar", "Kr", "Xe"]
noble_percent = [80]
pressures_atm = [1.0]
temperature_k = 293.15
energy_min_kev = 1.0
energy_max_kev = 1000.0
energy_points = 4
energies_kev = [1.0, 10.0, 100.0, 1000.0]
ions = "constituents"

[physics]
density_model = "ideal-gas"
gas_constant_l_atm_mol_k = 0.082057366080960
avogadro_mol = 6.02214076e23
compound_correction = 1.0
incidence_angle_deg = 0.0
displacement_energy_ev = 21.0
lattice_binding_energy_ev = 1.0e-6
surface_binding_energy_ev = 1.0e-6

[srmodule]
# Keep the proven full 1–1000 keV stopping-table bounds.
timeout_s = 180

[trim]
# Only five reviewed points are selected by binding_confirmation.py.
# Five independent 50-ion batches per point; matched seeds across models.
ions_per_job = 50
batches_per_point = 5
batch_start = 60
energy_points = 4
energies_kev = [1.0, 10.0, 100.0, 1000.0]
pressures_atm = [1.0]
derive_full_grid = false
job_order = "longest-first"
cascade_type = 2
timeout_s = 10800
workers_default = 15
max_attempts = 2
target_sigma_margin = 6.0
target_width_factor = 2.0
minimum_monolayers = 120.0
edge_fraction = 0.98

[convergence]
enabled = false
noble_percent = []
pressures_atm = []
energies_kev = []
ions_per_job = 10000
timeout_s = 10800
repeats = 3
maximum_relative_standard_error = 0.02

[validation]
qf_absolute_pressure_warning = 0.02
qf_absolute_pressure_failure = 0.05
srmodule_relative_tolerance = 1.0e-6
trim_srmodule_range_warning = 0.20
convergence_rse_severity = "warning"

[campaign]
sessions = 0
session_hours = 4.0
max_cumulative_hours = 4.0
stop_margin_minutes = 10.0

[execution]
backend = "pysrim"
srim_root = "../srim-2013"
pysrim_root = "../pysrim"
pysrim_expected_commit = "9b8e1b7e91fe65bf17e9366e1fd9b9406ad125d2"
wine_prefix = "../.wine-srim"
headless = true
