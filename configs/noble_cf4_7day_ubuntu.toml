[scan]
name = "noble_cf4_7day_ubuntu_direct"
families = ["Xe", "Kr", "Ar"]
noble_percent = [60, 65, 70, 75, 80, 85, 90, 95]
pressures_atm = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
temperature_k = 293.15
energy_min_kev = 0.1
energy_max_kev = 500.0
energy_points = 100
ions = "constituents"

[physics]
density_model = "ideal-gas"
gas_constant_l_atm_mol_k = 0.082057366080960
avogadro_mol = 6.02214076e23
compound_correction = 1.0
incidence_angle_deg = 0.0
displacement_energy_ev = 21.0
lattice_binding_energy_ev = 0.0
surface_binding_energy_ev = 0.0

[srmodule]
timeout_s = 180

[trim]
# Every pressure and energy is simulated directly with full cascades.
ions_per_job = 1000
cascade_type = 2
timeout_s = 172800
workers_default = 4
max_attempts = 3
target_sigma_margin = 6.0
target_width_factor = 2.0
minimum_monolayers = 120.0
edge_fraction = 0.98

[convergence]
enabled = true
noble_percent = [60, 95]
pressures_atm = [0.5, 3.0]
energies_kev = [0.1, 10.0, 500.0]
ions_per_job = 10000
# A 10,000-history heavy 500 keV repeat can exceed a week by itself. The
# campaign hard deadline still takes precedence and returns it to pending.
timeout_s = 1209600
repeats = 3
maximum_relative_standard_error = 0.02

[validation]
qf_absolute_pressure_warning = 0.02
qf_absolute_pressure_failure = 0.05
srmodule_relative_tolerance = 1.0e-6
trim_srmodule_range_warning = 0.20
convergence_rse_severity = "failure"

[campaign]
sessions = 0
session_hours = 168.0
max_cumulative_hours = 168.0
# One Xe 500 keV history took 76 s; the 48-hour margin conservatively covers a
# directly scaled 1,000-history baseline point plus archive/checkpoint work.
stop_margin_minutes = 2880.0

[execution]
backend = "pysrim"
srim_root = "../srim-2013"
pysrim_root = "../pysrim"
pysrim_expected_commit = "9b8e1b7e91fe65bf17e9366e1fd9b9406ad125d2"
wine_prefix = "../.wine-srim"
headless = true
