# Superset only: use scripts/low_energy_topup.sh, never run this grid directly.
[scan]
name = "noble_cf4_low_energy_topup"
profile = "preliminary"
families = ["Xe", "Kr", "Ar"]
noble_percent = [60, 70, 80, 90, 95]
pressures_atm = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
temperature_k = 293.15
energy_min_kev = 1.0
# Retain the known-working stopping-table range. SRModule was observed spinning
# after partial output when this upper bound was reduced to exactly 10 keV.
# The TRIM grid below remains limited to 1, 3 and 10 keV.
energy_max_kev = 1000.0
energy_points = 7
energies_kev = [1.0, 3.0, 10.0, 30.0, 100.0, 300.0, 1000.0]
ions = "constituents"

[physics]
density_model = "ideal-gas"
gas_constant_l_atm_mol_k = 0.082057366080960
avogadro_mol = 6.02214076e23
compound_correction = 1.0
incidence_angle_deg = 0.0
displacement_energy_ev = 21.0
lattice_binding_energy_ev = 0.0
surface_binding_energy_ev = 0.0

[srmodule]
timeout_s = 180

[trim]
ions_per_job = 50
batches_per_point = 12
batch_start = 10
energy_points = 3
energies_kev = [1.0, 3.0, 10.0]
pressures_atm = [0.5, 1.0, 1.5, 2.0, 2.5, 3.0]
derive_full_grid = false
job_order = "coverage-first"
cascade_type = 2
timeout_s = 600
workers_default = 15
max_attempts = 2
target_sigma_margin = 6.0
target_width_factor = 2.0
minimum_monolayers = 120.0
edge_fraction = 0.98

[convergence]
enabled = false
noble_percent = []
pressures_atm = []
energies_kev = []
ions_per_job = 10000
timeout_s = 21600
repeats = 3
maximum_relative_standard_error = 0.02

[validation]
qf_absolute_pressure_warning = 0.02
qf_absolute_pressure_failure = 0.05
srmodule_relative_tolerance = 1.0e-6
trim_srmodule_range_warning = 0.20
convergence_rse_severity = "warning"

[campaign]
sessions = 0
session_hours = 2.0
max_cumulative_hours = 0.0
stop_margin_minutes = 10.0

[execution]
backend = "pysrim"
srim_root = "../srim-2013"
pysrim_root = "../pysrim"
pysrim_expected_commit = "9b8e1b7e91fe65bf17e9366e1fd9b9406ad125d2"
wine_prefix = "../.wine-srim"
headless = true
